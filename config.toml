[rag]
index_path      = "./data/index.bin"
chunks_path     = "./data/chunks.json"
chunk_size      = 500
chunk_overlap   = 50
top_k           = 5
score_threshold = 0.3

[embedder]
model_type      = "custom_onnx"
onnx_path       = "./models/ruri-v3-310m/model.onnx"
tokenizer_path  = "./models/ruri-v3-310m/tokenizer.json"
doc_prefix      = "文章: "
query_prefix    = "クエリ: "

[llm]
base_url = "http://localhost:11434/v1"
model    = "nvidia-nemotron-nano-9b-v2-japanese:latest"
api_key  = "ollama"

[conversation]
max_history_turns   = 20
summary_keep_recent = 5
auto_save_summary   = true
summary_dir         = "./data/summaries"

[rag]
db_path         = "./data/store.db"
chunk_size      = 500
chunk_overlap   = 50
top_k           = 5
score_threshold = 0.3

[embedder]
model_type        = "custom_onnx"
onnx_path         = "./models/ruri-v3-310m/model.onnx"
tokenizer_path    = "./models/ruri-v3-310m/tokenizer.json"
doc_prefix        = "文章: "
query_prefix      = "クエリ: "
embed_batch_size  = 128

[llm]
#base_url = "http://localhost:18888/v1"
#model    = "Bonsai-8B-Q1_0"
base_url = "http://localhost:11434/v1"
model    = "gemma4:e4b"
api_key  = "dummy"

[conversation]
max_history_turns   = 20
summary_keep_recent = 5
auto_save_summary   = true
summary_dir         = "./data/summaries"
history_dir         = "./history"

[server]
host    = "127.0.0.1"
port    = 18080
api_key = ""           # Bearer token; leave empty to disable auth
log_filter = "rag_server=info,tower_http=debug"   # 省略可

[tts]
base_url = "http://localhost:8000/v1"
model    = "voicevox-v1"
voice    = "coral"

[emotion]
rules_path = "./emotion_rules.toml"

[chara]
dir     = "./chara"
default = "sample"     # リクエストで chara 未指定の場合に使うキャラID。省略時はデフォルトプロンプト

[package]
name = "rag-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rag"
path = "src/main.rs"

[dependencies]
rag-core = { path = "../rag-core" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
colored = "2"
tarpc = "0.34"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[package]
name = "rag-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rag_core"
path = "src/lib.rs"

[dependencies]
# Vector DB & Embedding (as specified in design)
hnswlib-rs = "0.1"        # Pure Rust HNSW (C dependency free, Windows compatible)
bincode = "1"              # Binary serialization for HNSW index
fastembed = "4"

# LLM Client
async-openai = "0.27"

# mod/dir
walkdir = "2"

# PDF & OCR
pdf-extract = "0.7"
leptess = "0.4"            # Tesseract + Leptonica bindings (OCR)

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Spreadsheets & Data Formats
calamine = "0.24"
csv = "1.3"
scraper = "0.19"
pulldown-cmark = "0.11"

# Media metadata
id3 = "1"
mp4ameta = "0.13"
kamadak-exif = "0.5"

# Video metadata
ffprobe = "0.4.0"

# Text processing & NLP
lindera = "0.40"          # Japanese morphological analysis for chunk splitting
#lindera = { version = "0.40", features = ["ipadic"] }  # Japanese morphological analysis for chunk splitting
lindera-ipadic = "0.40"   # 日本語辞書（IPAdic）

# Async & concurrency
tokio = { version = "1", features = ["full"] }
futures = "0.3"
notify = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Character encoding
encoding_rs = "0.8"

# Date/time
chrono = "0.4"

# Error handling
anyhow = "1"

[dev-dependencies]

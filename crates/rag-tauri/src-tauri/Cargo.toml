[package]
name = "rag-tauri"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rag-tauri"
path = "src/main.rs"

[dependencies]
rag-core = { path = "../../rag-core" }
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[dev-dependencies]

[package]
name = "rag-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rag-daemon"
path = "src/main.rs"

[dependencies]
rag-core = { path = "../rag-core" }
tarpc = { version = "0.34", features = ["full"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio-serde = { version = "0.9", features = ["json"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]

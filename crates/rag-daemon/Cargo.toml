[package]
name = "rag-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rag-daemon"
path = "src/main.rs"

[dependencies]
rag-core = { path = "../rag-core" }
tarpc = "0.34"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]